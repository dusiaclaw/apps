<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>My Apps</title>
<meta name="theme-color" content="#12151c">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
*{box-sizing:border-box;margin:0}
html,body{height:100%}
body{font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:#12151c;color:#f2f4f8;overflow:hidden;-webkit-tap-highlight-color:transparent}
#bg{position:fixed;inset:0;z-index:-1;transition:background .5s;background:radial-gradient(120% 70% at 50% 0%,var(--tint,#2a3550) 0%,#12151c 70%)}
.app{height:100dvh;display:flex;flex-direction:column;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
header{display:flex;align-items:baseline;justify-content:space-between;padding:14px 20px 6px}
header h1{font-size:20px;font-weight:700;letter-spacing:-.01em}
header span{font-size:13px;color:#aeb6c6;font-variant-numeric:tabular-nums}
#track{flex:1;min-height:0;display:flex;overflow-x:auto;overflow-y:hidden;scroll-snap-type:x mandatory;scrollbar-width:none;padding:6px 0}
#track::-webkit-scrollbar{display:none}
#track::before,#track::after{content:"";flex:0 0 calc((100% - var(--w))/2)}
.slide{--w:min(80vw,380px);flex:0 0 var(--w);scroll-snap-align:center;scroll-snap-stop:always;display:flex;flex-direction:column;padding:0 8px;transition:transform .3s,opacity .3s;transform:scale(.93);opacity:.55}
#track{--w:min(80vw,380px)}
.slide.on{transform:none;opacity:1}
.shot{flex:1;min-height:0;display:flex;justify-content:center}
.shot img{height:100%;max-width:100%;aspect-ratio:540/1110;object-fit:cover;object-position:top;border-radius:22px;border:3px solid #05070a;outline:1px solid #ffffff2e;box-shadow:0 14px 34px #0009;background:#000}
.info{padding:14px 4px 0}
.head{display:flex;align-items:center;gap:10px}
.head img{width:40px;height:40px;border-radius:10px;flex:none}
.head h2{font-size:19px;font-weight:700;line-height:1.15}
.tag{font-size:12px;color:#aeb6c6;margin-top:2px}
.info p{font-size:14px;line-height:1.4;color:#d5dae4;margin:9px 0 12px;min-height:4.2em}
.row{display:flex;gap:8px}
a.btn{flex:1;display:block;text-align:center;text-decoration:none;font-weight:700;font-size:16px;padding:13px;border-radius:14px;background:#f2f4f8;color:#12151c}
a.btn.src{flex:none;background:#ffffff1c;color:#f2f4f8;font-weight:600;font-size:14px;padding:13px 16px}
a.btn:active{transform:scale(.97)}
a:focus-visible,button:focus-visible{outline:2px solid #fff;outline-offset:2px}
#dots{display:flex;justify-content:center;gap:4px;padding:8px 0 12px}
#dots button{width:28px;height:28px;border:0;background:none;padding:0;display:grid;place-items:center;cursor:pointer}
#dots i{width:8px;height:8px;border-radius:4px;background:#ffffff4d;transition:all .25s}
#dots .on i{width:22px;background:#fff}
@media(max-height:620px){.info p{min-height:0;font-size:13px}.head img{width:32px;height:32px}}
@media(prefers-reduced-motion:reduce){*{transition:none!important;scroll-behavior:auto!important}}
</style>
</head>

</div>

const track=document.getElementById('track'),dots=document.getElementById('dots'),bg=document.getElementById('bg'),count=document.getElementById('count');
track.innerHTML=APPS.map((a,i)=>`<section class="slide" aria-label="${a.name}">
 <a class="shot" href="https://${USER}.github.io/${a.repo}/" aria-label="Open ${a.name}"><img src="${a.shot}" alt="Screenshot of ${a.name}" ${i>1?'loading="lazy"':''}></a>
 <div class="info"><div class="head"><img src="${a.icon}" alt=""><div><h2>${a.name}</h2><div class="tag">${a.tag}</div></div></div>
 <p>${a.desc}</p>
 <div class="row"><a class="btn" href="https://${USER}.github.io/${a.repo}/">Open</a><a class="btn src" href="https://github.com/${USER}/${a.repo}">Source</a></div></div></section>`).join('');
dots.innerHTML=APPS.map((a,i)=>`<button aria-label="${a.name}" data-i="${i}"><i></i></button>`).join('');
const slides=[...track.children],dbtn=[...dots.children];let cur=-1;
function setCur(i){if(i===cur)return;cur=i;slides.forEach((s,k)=>s.classList.toggle('on',k===i));dbtn.forEach((d,k)=>d.classList.toggle('on',k===i));
 bg.style.setProperty('--tint',APPS[i].tint);count.textContent=(i+1)+' / '+APPS.length;try{localStorage.setItem('myapps_last',i)}catch(e){}}
function goTo(i,smooth=true){i=Math.max(0,Math.min(APPS.length-1,i));const s=slides[i];track.scrollTo({left:s.offsetLeft-(track.clientWidth-s.offsetWidth)/2,behavior:smooth?'smooth':'auto'})}
function nearest(){const mid=track.scrollLeft+track.clientWidth/2;let b=0,bd=1e9;slides.forEach((s,i)=>{const d=Math.abs(s.offsetLeft+s.offsetWidth/2-mid);if(d<bd){bd=d;b=i}});return b}
let raf;track.addEventListener('scroll',()=>{cancelAnimationFrame(raf);raf=requestAnimationFrame(()=>setCur(nearest()))},{passive:true});
dots.addEventListener('click',e=>{const b=e.target.closest('button');if(b)goTo(+b.dataset.i)});
addEventListener('keydown',e=>{if(e.key==='ArrowRight')goTo(cur+1);if(e.key==='ArrowLeft')goTo(cur-1)});
addEventListener('resize',()=>goTo(cur,false));
let start=0;try{start=+localStorage.getItem('myapps_last')||0}catch(e){}
if(start>=APPS.length)start=0;setCur(start);requestAnimationFrame(()=>goTo(start,false));
</script>
